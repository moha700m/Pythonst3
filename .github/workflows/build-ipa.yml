name: iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, pythonista-ai-v2]
    paths:
      - "Pythonst3/**"
      - "Pythonst3Tests/**"
      - "Scripts/**"
      - "project.yml"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch embedded CPython
        run: ./Scripts/fetch_python.sh

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build application
        run: |
          set -o pipefail
          xcodebuild \
            -project Pythonst3.xcodeproj \
            -scheme Pythonst3 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            build | tee build.log

      - name: Validate application bundle
        run: |
          set -eu
          APP="build/Build/Products/Release-iphoneos/Pythonst3.app"
          check_file() {
            if [ ! -f "$1" ]; then
              echo "MISSING: $1"
              ls -la "$(dirname "$1")" || true
              exit 1
            fi
            echo "OK: $1"
          }
          check_exec() {
            if [ ! -x "$1" ]; then
              echo "NOT EXECUTABLE: $1"
              ls -la "$(dirname "$1")" || true
              exit 1
            fi
            echo "OK executable: $1"
          }
          test -d "$APP" || { echo "MISSING APP: $APP"; exit 1; }
          check_exec "$APP/Pythonst3"
          check_file "$APP/Info.plist"
          check_file "$APP/Frameworks/Python.framework/Python"
          check_file "$APP/python/lib/python3.13/os.py"
          test -d "$APP/python/lib/python3.13/lib-dynload" || { echo "MISSING lib-dynload"; exit 1; }
          check_file "$APP/python/lib/python3.13/lib-dynload/_heapq.cpython-313-iphoneos.fwork"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          test "$BUNDLE_ID" = "com.moha700m.pythonst3"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          test "$EXECUTABLE" = "Pythonst3"
          echo "Extension frameworks: $(find "$APP/Frameworks" -maxdepth 1 -name '*.framework' | wc -l | tr -d ' ')"
          ls "$APP/python/lib/python3.13/lib-dynload" | head -5
          file "$APP/Pythonst3"
          echo "Bundle identifier: $BUNDLE_ID"
          echo "Embedded Python: $(cat "$APP/python/lib/python3.13/_sysconfigdata__ios_arm64-iphoneos.py" 2>/dev/null | head -1 || true)"

      - name: Validate full-screen build metadata
        run: |
          set -eu
          APP="build/Build/Products/Release-iphoneos/Pythonst3.app"
          INFO="$APP/Info.plist"
          MINOS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$INFO")
          SDK=$(otool -l "$APP/Pythonst3" | awk '/cmd LC_BUILD_VERSION/{found=1; next} found && $1 == "sdk" {print $2; exit}')
          echo "MinimumOSVersion: $MINOS"
          echo "Build SDK: $SDK"
          test -n "$SDK"
          /usr/libexec/PlistBuddy -c 'Print :UILaunchScreen' "$INFO" >/dev/null
          echo "OK: UILaunchScreen is declared"
          python3 - "$SDK" <<'PY'
          import sys
          raw = sys.argv[1]
          major = int(raw.split(".")[0])
          if major < 26:
              raise SystemExit(
                  "FAIL: built with iOS SDK %s. Apps built with an SDK older than the "
                  "device OS are letterboxed on iOS 26. Build with Xcode 26 or newer." % raw
              )
          print("OK: build SDK %s renders full-screen on iOS 26" % raw)
          PY

      - name: Run simulator smoke tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Pythonst3.xcodeproj \
            -scheme Pythonst3 \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=YES | tee test.log

      - name: Capture iPhone layout matrix
        run: ./Scripts/capture_layouts.sh "build-tests/Build/Products/Debug-iphonesimulator/Pythonst3.app" screenshots

      - name: Upload layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-layout-screenshots
          path: screenshots/
          retention-days: 30
          if-no-files-found: error

      - name: Package unsigned IPA
        run: |
          set -eu
          APP="build/Build/Products/Release-iphoneos/Pythonst3.app"
          rm -rf Payload Pythonst3-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/Pythonst3.app
          zip -qry Pythonst3-unsigned.ipa Payload
          shasum -a 256 Pythonst3-unsigned.ipa > Pythonst3-unsigned.ipa.sha256

      - name: Validate IPA structure
        run: |
          set -eu
          unzip -l Pythonst3-unsigned.ipa | tee ipa-contents.txt
          grep -q 'Payload/Pythonst3.app/Pythonst3' ipa-contents.txt
          grep -q 'Payload/Pythonst3.app/Info.plist' ipa-contents.txt
          grep -q 'Payload/Pythonst3.app/Frameworks/Python.framework/Python' ipa-contents.txt
          grep -q 'Payload/Pythonst3.app/python/lib/python3.13/os.py' ipa-contents.txt

          rm -rf /tmp/ipa-check
          mkdir -p /tmp/ipa-check
          unzip -q Pythonst3-unsigned.ipa -d /tmp/ipa-check
          IPA_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' /tmp/ipa-check/Payload/Pythonst3.app/Info.plist)
          test "$IPA_BUNDLE_ID" = "com.moha700m.pythonst3"
          echo "IPA bundle identifier: $IPA_BUNDLE_ID"
          echo "IPA size: $(du -h Pythonst3-unsigned.ipa | cut -f1)"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pythonst3-unsigned-IPA
          path: |
            Pythonst3-unsigned.ipa
            Pythonst3-unsigned.ipa.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: |
            build.log
            test.log
            ipa-contents.txt
          retention-days: 7
          if-no-files-found: ignore
